<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres</title>
  <!-- Style commun à toutes les pages, puis style propre aux paramètres -->
  <link rel="stylesheet" href="conversation.css">
  <link rel="stylesheet" href="parametre.css">
  <!-- Icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<!-- "sans-liste" = une seule colonne -->
<body class="sans-liste">

  <!-- En-tête identique aux autres pages -->
  <header>
    <div class="titre">
      <img src="logo-dark-big.webp" alt="Logo Octobots" class="logo-petit">
      <h1>Messagerie Octobots</h1>
    </div>
    <nav>
      <ul>
        <li><a href="conversation.html"><i class="fa-solid fa-comments"></i> Conversations</a></li>
        <li><a href="contact.html"><i class="fa-solid fa-user-group"></i> Contacts</a></li>
        <li><a href="faq.html"><i class="fa-solid fa-circle-question"></i> FAQ</a></li>
        <li><a href="parametre.html" aria-current="page"><i class="fa-solid fa-gear"></i> Paramètres</a></li>
      </ul>
      <button id="bouton-theme" class="bouton-theme" type="button" aria-label="Changer de thème">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
    </nav>
  </header>

  <main>
    <h2>Paramètres</h2>

    <div class="tabs-container">
      <!-- Les onglets (boutons) -->
      <div class="tab-header">
        <button class="tab-button active" onclick="openTab(event, 'profil')">Profil</button>
        <button class="tab-button" onclick="openTab(event, 'notifications')">Notifications</button>
        <button class="tab-button" onclick="openTab(event, 'session')">Session</button>
      </div>

      <!-- Onglet Profil (affiché au départ) -->
      <div id="profil" class="tab-content" style="display: block;">
        <h3>Mon profil</h3>
        <p>Nom : Anne-Samuelle Allebi</p>
        <p>Courriel : aaallebi@etu.uqac.ca</p>
      </div>

      <!-- Onglet Notifications (caché au départ) -->
      <div id="notifications" class="tab-content" style="display: none;">
        <h3>Notifications</h3>
        <label><input type="checkbox" id="son-messages" checked> Son à la réception d'un message</label>
      </div>

      <!-- Onglet Session (caché au départ) -->
      <div id="session" class="tab-content" style="display: none;">
        <h3>Session</h3>
        <p>Vous serez renvoyé à la page de connexion.</p>
        <a href="index.html" class="btn-deconnexion"><i class="fa-solid fa-right-from-bracket"></i> Se déconnecter</a>
      </div>
    </div>
  </main>

  <!-- Onglets et préférence de son -->
  <script src="parametre.js"></script>
  <!-- Thème clair / sombre -->
  <script src="theme.js"></script>
</body>
</html>
